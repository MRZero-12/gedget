<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesanan Berhasil — GadgetZone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/navbar.css">
  <style>
    .thankyou-section {
      max-width: 680px;
      margin: 0 auto;
      padding: 60px 20px 40px;
      text-align: center;
      animation: fadeInUp 0.6s ease;
    }
    .thankyou-icon {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: var(--accent-dim);
      border: 2px solid var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 2.8rem;
      color: var(--accent);
      animation: bounceIn 0.6s ease 0.2s both;
    }
    .thankyou-section h1 {
      font-size: 2rem;
      margin-bottom: 8px;
    }
    .thankyou-section .order-id {
      display: inline-block;
      padding: 6px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 50px;
      font-family: var(--font-display);
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 24px;
      letter-spacing: 1px;
    }
    .thankyou-section > p {
      color: var(--text-secondary);
      font-size: 1rem;
      margin-bottom: 40px;
      line-height: 1.7;
    }
    .order-details {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      text-align: left;
      margin-bottom: 32px;
    }
    .order-details h3 {
      font-size: 1rem;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .order-details h3 i { color: var(--accent); }
    .order-item {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .order-item:last-of-type { border-bottom: none; }
    .order-item img {
      width: 48px; height: 48px;
      border-radius: 8px;
      object-fit: cover;
    }
    .order-item-info {
      flex: 1;
      min-width: 0;
    }
    .order-item-info .name {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .order-item-info .qty {
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .order-item .price {
      font-weight: 600;
      color: var(--accent);
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .order-totals {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }
    .order-totals .row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }
    .order-totals .row.total {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      padding-top: 12px;
      margin-top: 8px;
      border-top: 1px solid var(--border);
    }
    .order-totals .row.total span:last-child {
      color: var(--accent);
    }
    .order-totals .row.free { color: var(--accent); }
    .shipping-info {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px 20px;
      text-align: left;
      margin-bottom: 32px;
      font-size: 0.88rem;
      color: var(--text-secondary);
      line-height: 1.7;
    }
    .shipping-info strong {
      color: var(--text);
    }
    .thankyou-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .no-order {
      padding: 120px 20px;
      text-align: center;
    }
    .no-order i {
      font-size: 3rem;
      color: var(--text-muted);
      margin-bottom: 20px;
      opacity: 0.4;
    }
  </style>
</head>
<body>

  <div class="bg-ambience" aria-hidden="true">
    <div class="bg-blob bg-blob--1"></div>
    <div class="bg-blob bg-blob--2"></div>
    <div class="bg-blob bg-blob--3"></div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <div class="mobile-overlay" id="mobileOverlay"></div>

  <nav class="navbar scrolled" id="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
        GadgetZone
      </a>
      <div class="navbar-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <a href="index.html?category=smartphones" class="nav-link">Smartphones</a>
        <a href="index.html?category=laptops" class="nav-link">Laptops</a>
        <a href="index.html?category=audio" class="nav-link">Audio</a>
        <a href="index.html?category=wearables" class="nav-link">Wearables</a>
        <a href="index.html?category=gaming" class="nav-link">Gaming</a>
      </div>
      <div class="navbar-actions">
        <a href="cart.html" class="cart-icon" aria-label="Keranjang belanja">
          <i class="fas fa-shopping-bag"></i>
          <span class="cart-badge" id="cartBadge">0</span>
        </a>
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </nav>

  <main>
    <div class="container" id="thankyouContent">
      <!-- Rendered by JS -->
    </div>
  </main>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-brand">
        <h3><i class="fas fa-bolt"></i> GadgetZone</h3>
        <p>Toko gadget terlengkap dengan harga terbaik dan garansi resmi.</p>
      </div>
      <div class="footer-col">
        <h4>Kategori</h4>
        <a href="index.html?category=smartphones">Smartphones</a>
        <a href="index.html?category=laptops">Laptops</a>
        <a href="index.html?category=audio">Audio</a>
        <a href="index.html?category=wearables">Wearables</a>
        <a href="index.html?category=gaming">Gaming</a>
      </div>
      <div class="footer-col">
        <h4>Bantuan</h4>
        <a href="faq.html">FAQ</a>
        <a href="#">Pengiriman</a>
        <a href="#">Pengembalian</a>
        <a href="#">Kontak Kami</a>
      </div>
      <div class="footer-col">
        <h4>Ikuti Kami</h4>
        <div class="social-links">
          <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
          <a href="#" aria-label="Twitter"><i class="fab fa-x-twitter"></i></a>
          <a href="#" aria-label="YouTube"><i class="fab fa-youtube"></i></a>
          <a href="#" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
        </div>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2024 GadgetZone. All rights reserved.</p>
    </div>
  </footer>

  <button class="scroll-top" id="scrollTop" aria-label="Kembali ke atas">
    <i class="fas fa-chevron-up"></i>
  </button>

  <script src="js/data.js"></script>
  <script src="js/cart.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('thankyouContent');
      let order;

      try {
        order = JSON.parse(sessionStorage.getItem('gadgetzone_order'));
      } catch (e) {
        order = null;
      }
    
      if (!order) {
        container.innerHTML = `
          <div class="no-order">
            <i class="fas fa-receipt"></i>
            <h2>Tidak Ada Pesanan</h2>
            <p style="color:var(--text-secondary);margin-bottom:24px;">Tidak ditemukan data pesanan terbaru.</p>
            <a href="index.html" class="btn btn--primary">Kembali Belanja</a>
          </div>
        `;
        return;
      }

      const paymentLabels = { transfer: 'Transfer Bank', ewallet: 'E-Wallet', cod: 'Bayar di Tempat (COD)' };

      const itemsHtml = order.items.map(item => `
        <div class="order-item">
          <img src="${item.image}" alt="${item.name}">
          <div class="order-item-info">
            <div class="name">${item.name}</div>
            <div class="qty">x${item.qty}</div>
          </div>
          <span class="price">${formatPrice(item.price * item.qty)}</span>
        </div>
      `).join('');

     container.innerHTML = `
  <div class="thankyou-section">
    <div class="thankyou-icon">
      <i class="fas fa-check"></i>
    </div>

    <h1>Pesanan Berhasil!</h1>

    <div class="order-id">${order.orderId}</div>

    <p>
      Terima kasih atas pesanan kamu! Kami akan segera memproses pesananmu.
      Konfirmasi akan dikirim ke email <strong>${order.customer.email}</strong>.
    </p>

    <div class="order-details">
      <h3><i class="fas fa-box"></i> Detail Pesanan</h3>

      ${itemsHtml}

      <div class="order-totals">
        <div class="row">
          <span>Subtotal</span>
          <span>${formatPrice(order.subtotal)}</span>
        </div>

        <div class="row ${order.shipping === 0 ? 'free' : ''}">
          <span>Ongkos Kirim</span>
          <span>
            ${order.shipping === 0 ? 'Gratis' : formatPrice(order.shipping)}
          </span>
        </div>

        <div class="row">
          <span>Metode Pembayaran</span>
          <span>${paymentLabels[order.paymentMethod]}</span>
        </div>

        <div class="row total">
          <span>Total</span>
          <span>${formatPrice(order.total)}</span>
        </div>
      </div>

    </div>
  </div>
  `;
});
   </script>
</body>
</html>
